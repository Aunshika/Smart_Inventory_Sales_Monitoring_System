<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Smart Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <main class="reset-page">
    <section class="reset-card">
      <div class="auth-logo"><span class="auth-logo-mark">SI</span><strong>Smart <em>Inventory</em></strong></div>
      <h1>Reset Password</h1>
      <p>Create a new password for your Smart Inventory account.</p>
      <form id="resetPasswordForm" class="reset-page-form">
        <label>New Password<span class="reset-input-wrap"><input id="newPassword" type="password" required minlength="8" autocomplete="new-password"><button class="reset-eye-button" type="button" data-reset-password="newPassword" aria-label="Show new password"></button></span></label>
        <div id="resetPasswordFeedback" class="password-feedback" aria-live="polite" hidden></div>
        <label>Confirm Password<span class="reset-input-wrap"><input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password"><button class="reset-eye-button" type="button" data-reset-password="confirmPassword" aria-label="Show confirmed password"></button></span></label>
        <p id="confirmPasswordMessage" class="password-match-message" hidden></p>
        <p id="resetStatus" class="auth-status" hidden></p>
        <button id="resetPasswordButton" type="submit" disabled>Reset Password</button>
      </form>
      <a href="/login" class="reset-back-link">Back to Sign In</a>
    </section>
  </main>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/reset-password.js?v=email-flow-fix-1"></script>
</body>
</html>
