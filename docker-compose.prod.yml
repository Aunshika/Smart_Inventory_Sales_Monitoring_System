services:
  database:
    image: mongo:7
    restart: always
    volumes:
      - smart_inventory_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - smart_inventory_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      MONGODB_URI: mongodb://database:27017/Smartinventory
      DATABASE_NAME: Smartinventory
      RUN_STARTUP_MAINTENANCE: "0"
    expose:
      - "8080"
    volumes:
      - smart_inventory_uploads:/app/backend/uploads
      - smart_inventory_exports:/app/exports
      - smart_inventory_logs:/app/logs
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - smart_inventory_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: always
    environment:
      API_BASE_URL: ${PUBLIC_BACKEND_URL}
      GOOGLE_AUTH_API_BASE_URL: ${PUBLIC_BACKEND_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_ENABLED: ${RECAPTCHA_ENABLED:-true}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - smart_inventory_network

volumes:
  smart_inventory_mongo_data:
  smart_inventory_uploads:
  smart_inventory_exports:
  smart_inventory_logs:

networks:
  smart_inventory_network:
    driver: bridge

