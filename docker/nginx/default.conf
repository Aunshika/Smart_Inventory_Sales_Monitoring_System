server {
    listen 5500;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /reset-password.html {
        try_files /reset-password.html =404;
    }

    location /frontend/reset-password.html {
        return 302 /reset-password.html$is_args$args;
    }

    location /frontend/index.html {
        return 302 /login;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
