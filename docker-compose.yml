services:
  database:
    image: mongo:7
    container_name: smart_inventory_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - smart_inventory_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - smart_inventory_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smart_inventory_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://database:27017/Smartinventory
      DATABASE_NAME: Smartinventory
      FRONTEND_URL: http://localhost:5500
      RUN_STARTUP_MAINTENANCE: "0"
    ports:
      - "8080:8080"
    volumes:
      - smart_inventory_uploads:/app/backend/uploads
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - smart_inventory_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: smart_inventory_frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://localhost:8080
      GOOGLE_AUTH_API_BASE_URL: http://localhost:8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_ENABLED: ${RECAPTCHA_ENABLED:-true}
    ports:
      - "5500:5500"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smart_inventory_network

volumes:
  smart_inventory_mongo_data:
  smart_inventory_uploads:

networks:
  smart_inventory_network:
    driver: bridge
